[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-josa-sink"
version = "0.1.0"
description = "Quantitative analysis of Korean postposition-focused activation sink in Korean LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
  "torch",
  "transformers>=4.46.0",
  "accelerate",
  "bitsandbytes",
  "sentencepiece",
  "huggingface_hub",
  "konlpy",
  "JPype1",
  "scipy",
  "statsmodels",
  "pandas",
  "numpy",
  "matplotlib",
  "tqdm",
  "pyyaml",
  "psutil"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
josa-sink-run = "josa_sink.cli:main"
